<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Màu Sắc Trực Tuyến Toàn Cầu</title>
    <style>
        @keyframes rainbowBackground {
            0% { background-color: #ff4d4d; }
            16% { background-color: #ffa500; }
            33% { background-color: #ffd700; }
            50% { background-color: #228b22; }
            66% { background-color: #0000ff; }
            83% { background-color: #800080; }
            100% { background-color: #ff4d4d; }
        }

        :root {
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Hiệu ứng chuyển động màu cầu vồng cho nền */
            animation: rainbowBackground 15s infinite linear;
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: #475569;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #334155;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        p.subtitle {
            color: #475569;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        /* Thanh chọn màu */
        .search-box {
            margin-bottom: 1rem;
        }

        .search-box select {
            width: 100%;
            padding: 1rem 1.25rem;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            background: white;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
        }

        .status-msg {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 2rem;
            min-height: 1.5rem;
        }

        /* Lưới hiển thị kết quả từ mạng */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .color-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .color-preview {
            height: 110px;
            width: 100%;
        }

        .color-info {
            padding: 12px;
        }

        .color-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: #0f172a;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .color-hex {
            font-family: monospace;
            font-size: 0.85rem;
            color: #64748b;
        }

        .loading {
            text-align: center;
            font-size: 1.1rem;
            color: #64748b;
            grid-column: 1 / -1;
            padding: 3rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Quay lại trang hướng dẫn</a>
        
        <h1>🌐 Tra Cứu Màu Sắc Trực Tuyến Toàn Cầu</h1>
        <p class="subtitle">Chọn một màu phổ biến từ thanh menu bên dưới. Hệ thống sẽ tự động gửi yêu cầu ra cơ sở dữ liệu trên thế giới để lấy kết quả.</p>

        <!-- Thanh chọn màu phổ biến -->
        <div class="search-box">
            <select id="colorSelect" onchange="fetchWorldColors()">
                <option value="" disabled selected>-- Chọn màu sắc phổ biến trên thế giới --</option>
                
                <optgroup label="1. Màu Đỏ (Red)">
                    <option value="red">Đỏ cơ bản (Red)</option>
                    <option value="crimson">Đỏ sẫm / Đỏ cờ (Crimson)</option>
                    <option value="ruby">Đỏ hồng ngọc (Ruby)</option>
                    <option value="maroon">Đỏ bã trầu / Đỏ đô (Maroon)</option>
                    <option value="salmon">Đỏ cá hồi (Salmon)</option>
                </optgroup>

                <optgroup label="2. Màu Cam (Orange)">
                    <option value="orange">Cam cơ bản (Orange)</option>
                    <option value="dark orange">Cam đậm (Dark Orange)</option>
                    <option value="coral">Cam san hô (Coral)</option>
                    <option value="peach">Cam đào (Peach)</option>
                </optgroup>

                <optgroup label="3. Màu Vàng (Yellow)">
                    <option value="yellow">Vàng cơ bản (Yellow)</option>
                    <option value="gold">Vàng kim / Vàng óng (Gold)</option>
                    <option value="lemon">Vàng chanh (Lemon)</option>
                    <option value="amber">Vàng hổ phách (Amber)</option>
                </optgroup>

                <optgroup label="4. Màu Xanh Lá (Green)">
                    <option value="green">Xanh lá cơ bản (Green)</option>
                    <option value="lime">Xanh nõn chuối (Lime)</option>
                    <option value="forest green">Xanh rừng (Forest Green)</option>
                    <option value="olive">Xanh ô liu (Olive)</option>
                    <option value="mint">Xanh bạc hà (Mint)</option>
                </optgroup>

                <optgroup label="5. Màu Xanh Dương (Blue)">
                    <option value="blue">Xanh dương cơ bản (Blue)</option>
                    <option value="sky blue">Xanh da trời (Sky Blue)</option>
                    <option value="navy">Xanh tím than (Navy)</option>
                    <option value="royal blue">Xanh hoàng gia (Royal Blue)</option>
                    <option value="cyan">Xanh ngọc / Xanh lơ (Cyan)</option>
                </optgroup>

                <optgroup label="6. Màu Tím (Purple)">
                    <option value="purple">Tím cơ bản (Purple)</option>
                    <option value="violet">Tím hoa cà (Violet)</option>
                    <option value="indigo">Tím chàm (Indigo)</option>
                    <option value="lavender">Tím oải hương (Lavender)</option>
                </optgroup>

                <optgroup label="7. Màu Hồng (Pink)">
                    <option value="pink">Hồng cơ bản (Pink)</option>
                    <option value="hot pink">Hồng đậm rực rỡ (Hot Pink)</option>
                    <option value="magenta">Hồng tím / Đỏ tươi (Magenta)</option>
                    <option value="rose">Hồng cánh hồng (Rose)</option>
                </optgroup>

                <optgroup label="8. Màu Trung Tính & Cơ Bản">
                    <option value="black">Đen (Black)</option>
                    <option value="white">Trắng (White)</option>
                    <option value="gray">Xám (Gray)</option>
                    <option value="silver">Màu bạc (Silver)</option>
                    <option value="brown">Nâu (Brown)</option>
                </optgroup>
            </select>
        </div>
        <div id="statusMsg" class="status-msg"></div>

        <!-- Khu vực hiển thị kết quả từ server ngoài -->
        <div id="colorContainer" class="color-grid">
            <div class="loading">Hãy chọn một màu ở menu phía trên để truy vấn dữ liệu từ thế giới!</div>
        </div>
    </div>

    <script>
        async function fetchWorldColors() {
            let query = document.getElementById('colorSelect').value;
            let container = document.getElementById('colorContainer');
            let statusMsg = document.getElementById('statusMsg');

            if (!query) return;

            container.innerHTML = `<div class="loading">⏳ Đang kết nối mạng để truy vấn cơ sở dữ liệu màu toàn cầu...</div>`;
            statusMsg.innerHTML = `Đang tìm kiếm dữ liệu cho: <strong>${query}</strong>...`;

            try {
                let response = await fetch(`https://api.color.pizza/v1/names/?name=${encodeURIComponent(query)}`);
                let data = await response.json();

                container.innerHTML = "";

                if (data && data.colors && data.colors.length > 0) {
                    statusMsg.innerHTML = `✨ Đã lấy thành công <strong>${data.colors.length}</strong> kết quả từ máy chủ màu quốc tế!`;

                    data.colors.forEach(color => {
                        let card = document.createElement('div');
                        card.className = 'color-card';
                        card.innerHTML = `
                            <div class="color-preview" style="background-color: ${color.hex};"></div>
                            <div class="color-info">
                                <div class="color-name">${color.name}</div>
                                <div class="color-hex">${color.hex}</div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    statusMsg.innerHTML = `❌ Không tìm thấy màu nào trên hệ thống mạng cho từ khóa này.`;
                }
            } catch (error) {
                container.innerHTML = "";
                statusMsg.innerHTML = `⚠️ Lỗi kết nối mạng hoặc máy chủ dữ liệu bên ngoài đang bận. Vui lòng thử lại!`;
            }
        }
    </script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then((reg) => console.log('Service Worker đăng ký thành công!', reg))
        .catch((err) => console.log('Đăng ký Service Worker thất bại:', err));
    });
  }
</script>

</body>
</html>
